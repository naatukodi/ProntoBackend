name: Build, push and deploy production image

on:
  push:
    branches:
      - Prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-acr
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Must match the GitHub environment holding the Azure secrets and the
    # environment configured in the Azure federated identity credential.
    environment: Production
    env:
      # Registry name without .azurecr.io. The Azure identity needs push access.
      ACR_NAME: vehgaacr
      ACR_LOGIN_SERVER: vehgaacr.azurecr.io
      IMAGE_NAME: valuation-api
      # The production web app. The Azure identity needs Website Contributor on it.
      RESOURCE_GROUP: vehgaprod
      WEBAPP_NAME: vehgaprd
      # Client ID of the managed identity the app pulls images with (ua-id-9170).
      PULL_IDENTITY_CLIENT_ID: 6ffe7996-2c71-4974-b985-0e1eb7b10fbb
      # Touches Cosmos, so a 200 means the container is up and connected.
      SMOKE_URL: https://vehgaprd-ech3ewccc8dxcgcz.centralindia-01.azurewebsites.net/api/valuations/search?q=zzhealthzz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate registry configuration
        shell: bash
        run: |
          if [[ ! "$ACR_NAME" =~ ^[a-zA-Z0-9]{5,50}$ ]]; then
            echo "::error::ACR_NAME must be the registry name without .azurecr.io."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        shell: bash
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app is pinned to an exact image, so a new push changes nothing until
      # this points it at the new tag. Every setting is passed explicitly so an
      # update can never drop the port or the pull identity.
      - name: Point vehgaprd at the new image
        shell: bash
        run: |
          az webapp sitecontainers update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-name main \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            --target-port 8080 \
            --is-main true \
            --user-assigned-identity "$PULL_IDENTITY_CLIENT_ID" \
            --output none

      - name: Wait for vehgaprd to answer
        shell: bash
        run: |
          sleep 45
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SMOKE_URL" || true)
            if [ "$code" = "200" ]; then echo "vehgaprd is serving (HTTP 200)"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 20
          done
          echo "::error::vehgaprd did not answer 200 within about 11 minutes"
          exit 1
