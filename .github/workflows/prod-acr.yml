name: Build and push production image to ACR

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-acr
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Must match the GitHub environment holding the Azure secrets and the
    # environment configured in the Azure federated identity credential.
    environment: Production
    env:
      # Registry name without .azurecr.io. The Azure identity needs push access.
      ACR_NAME: vehgaacr
      IMAGE_NAME: valuation-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate registry configuration
        shell: bash
        run: |
          if [[ ! "$ACR_NAME" =~ ^[a-zA-Z0-9]{5,50}$ ]]; then
            echo "::error::ACR_NAME must be the registry name without .azurecr.io."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        id: acr
        shell: bash
        run: |
          az acr login --name "$ACR_NAME"
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
